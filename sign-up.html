<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Create Account — SnapNet</title>
    <meta name="description" content="Create a free SnapNet account and connect with skilled professionals.">
    <meta property="og:title" content="Create Account — SnapNet">
    <meta property="og:description" content="Create a free SnapNet account.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">SNAP NET</h1>
            <nav class="nav-menu" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="how-it-works.html">How It Works</a>
                <a href="hire-me.html">Hire Talent</a>
            </nav>
        </div>
    </header>

    <form class="form" aria-label="Create account form">
        <p id="heading">Create Account</p>
        <div class="field">
            <input id="signup-username" autocomplete="username" placeholder="Username" class="input-field" type="text" required>
        </div>
        <div class="field">
            <input id="signup-email" autocomplete="email" placeholder="Email" class="input-field" type="email" required>
        </div>
        <div class="field">
            <input id="signup-password" autocomplete="new-password" placeholder="Password" class="input-field" type="password" required>
        </div>
        <div class="field">
            <input id="signup-confirm-password" autocomplete="new-password" placeholder="Confirm Password" class="input-field" type="password" required>
        </div>
        <div class="btn">
            <button type="submit" class="button1">Sign Up</button>
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
